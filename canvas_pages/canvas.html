<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        canvas {
            border: 1px solid black;
        }
        body, html {
            margin: 0;
        }
    </style>
    <title>Apprendre Canvas</title>
</head>
<body>
    <canvas id="canvas"></canvas>
    <section id="parameters-section">
        <form action="">

            <input type="number" placeholder="Pixel per Meter" id="scale">
            <input type="button" value="Start" id="start">
            <input type="checkbox" id="bottom-option">
        </form>


    </section>
    <script src="../js/canvas/physics.js"></script>

</html>
